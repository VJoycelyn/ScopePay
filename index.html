<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open the live ScopePay website.">
  <meta name="theme-color" content="#162b32">
  <title>ScopePay — Live Website</title>
  <style>
    :root { color-scheme: light; --ink: #162b32; --muted: #52666d; --paper: #f5f4ef; --accent: #c66c4f; --line: #d6d9d3; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.25rem; background: var(--paper); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 42rem); padding: clamp(2rem, 7vw, 4.5rem); background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--accent); }
    .eyebrow { margin: 0 0 .8rem; color: var(--muted); font-size: .76rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.7rem, 11vw, 5rem); letter-spacing: -.065em; line-height: .98; }
    p { max-width: 34rem; margin: 1.1rem 0 0; color: var(--muted); }
    .visit { display: inline-flex; align-items: center; gap: .8rem; margin-top: 2rem; padding: .9rem 1.15rem; background: var(--ink); color: #fff; font-weight: 750; text-decoration: none; }
    .visit:hover { background: #294750; }
    .visit:focus-visible, .url:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .url-label { margin-top: 1.4rem; font-size: .8rem; }
    .url { color: var(--ink); overflow-wrap: anywhere; text-underline-offset: .18em; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .76rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Live website</p>
    <h1>ScopePay</h1>
    <p>Open the ScopePay website to explore the live application.</p>
    <a class="visit" href="https://scopepay.manus.space/">Visit the ScopePay website <span aria-hidden="true">→</span></a>
    <p class="url-label">Website address: <a class="url" href="https://scopepay.manus.space/">https://scopepay.manus.space/</a></p>
    <footer>This page is the GitHub Pages entry point for ScopePay.</footer>
  </main>
</body>
</html>
